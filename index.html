<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>MzozM | 博客</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="github-avatar.png">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <style>
        /* 全页继承同一字体栈；苹果设备使用系统字体，其他平台使用本地替代字体。 */
        html { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
        body { margin: 40px; background: var(--paper); color: var(--ink); font-size: 16px; font-weight: 400; line-height: 1.65; }
        .container { max-width: 700px; margin: auto; background: var(--paper); padding: 32px 40px; border-radius: 12px; box-shadow: 0 2px 12px var(--border); }
        .profile-header { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
        h1 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.25; letter-spacing: -0.5px; }
        .countdown { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; line-height: 1.4; }
        .countdown[hidden] { display: none; }
        .countdown::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
        .countdown-days { color: var(--ink); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .avatar { flex-shrink: 0; width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
        .info { color: var(--muted); margin-bottom: 18px; }
        a { color: var(--ink); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .section { margin-bottom: 28px; }
        .section-minimal { margin-bottom: 24px; }
        .section-minimal h2 { margin: 0 0 10px; color: var(--ink); font-size: 18px; font-weight: 600; line-height: 1.5; }
        /* 日期独立成列，长标题换行时仍与标题列对齐。 */
        .writing-list { list-style: none; margin: 0; padding: 0; }
        .writing-entry { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); align-items: baseline; gap: 2px 16px; padding: 7px 0; font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        .writing-date { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .writing-title { min-width: 0; color: var(--ink); font-size: inherit; font-weight: 400; overflow-wrap: anywhere; }
        .writing-link, .writing-link:hover { color: inherit; text-decoration: none; }
        .writing-link .writing-title { text-decoration: underline; text-decoration-color: var(--underline); text-underline-offset: 3px; }
        .writing-link:hover .writing-title, .writing-link:focus-visible .writing-title { color: var(--ink); text-decoration-color: currentColor; }
        @media (max-width: 480px) {
            body { margin: 16px; }
            .container { padding: 24px 20px; }
            .profile-header { gap: 12px; }
            .profile-header > div { min-width: 0; }
            .writing-entry { grid-template-columns: 5em minmax(0, 1fr); column-gap: 12px; font-size: 16px; }
        }
        .contact-links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; font-size: 14px; }
        .contact-links a { color: var(--ink); }
    </style>
</head>
<body>
    <div class="container">
        <header class="profile-header">
            <img src="github-avatar.png" alt="MzozM 的 GitHub 头像" class="avatar">
            <div>
                <h1>MzozM's Blog</h1>
                <div class="countdown" id="countdown" role="timer" hidden>
                    <span class="countdown-days" id="countdown-days"></span><span>天</span>
                </div>
            </div>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到深色模式" title="切换到深色模式" hidden>
                <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3A9 9 0 0 1 10.7 3.1a9 9 0 1 0 10.2 10.2Z"/></svg>
                <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </header>
        <div class="info">
            每天想毕业! @ 好好学习 | AI爱好者 | 持续学习与分享
        </div>
        <div class="section">
            <p>
                👋 Hi，我是MzozM，热衷于学习新技术、写博客、逛GitHub。<br>
                🌟目标：持续成长，记录每一次进步！
            </p>
        </div>
        <div class="section section-minimal">
            <h2>最新博客</h2>
            <ul class="writing-list">
                <li class="writing-entry">
                    <time class="writing-date" datetime="2026-07-01" title="2026年7月1日">2026 · 07</time>
                    <span class="writing-title">AI infra</span>
                </li>
            </ul>
        </div>
        <section class="section section-minimal" id="notes" aria-labelledby="notes-heading">
            <h2 id="notes-heading">Note</h2>
            <ul class="writing-list">
                <li>
                    <a class="writing-entry writing-link" href="note/commit-conventions.html">
                        <time class="writing-date" datetime="2026-11-08" title="2026年11月8日">2026 · 11</time>
                        <span class="writing-title">提交 Commit 的约定</span>
                    </a>
                </li>
            </ul>
        </section>
        <div class="section section-minimal">
            <h2>联系方式</h2>
            <p class="contact-links">
                <a href="https://github.com/MzozM/">GitHub</a>
                <a href="https://scholar.google.com/">Google Scholar</a>
            </p>
        </div>
    </div>
    <script>
        // 按访客本地日期倒数到当年 12 月 31 日；当天为 0 天，跨年自动重置。
        const millisecondsPerDay = 24 * 60 * 60 * 1000;
        const countdownRefreshMilliseconds = 1000;

        function updateCountdown(today = new Date()) {
            const countdown = document.getElementById("countdown");
            const year = today.getFullYear();
            // 将日历日期映射为 UTC，避免夏令时造成一天不足或超过 24 小时。
            const targetDay = Date.UTC(year, 11, 31);
            const currentDay = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
            const remainingDays = Math.max(0, Math.round((targetDay - currentDay) / millisecondsPerDay));
            document.getElementById("countdown-days").textContent = remainingDays;
            countdown.setAttribute("aria-label", `距离 ${year} 年 12 月 31 日还有 ${remainingDays} 天`);
            countdown.hidden = false;
        }

        updateCountdown();
        setInterval(updateCountdown, countdownRefreshMilliseconds);
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) updateCountdown();
        });
    </script>
</body>
</html>
